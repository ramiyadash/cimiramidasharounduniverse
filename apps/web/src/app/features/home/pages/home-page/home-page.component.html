<main class="main-content">
  <!--
    This planning prompt belongs specifically to
    the Plan/Home page. It remains sticky beneath
    the global application header.
  -->
  <section
    class="sticky-planner-region"
    aria-label="Start planning a journey"
  >
    <form
      class="sticky-planner"
      [style.--planner-accent]="
        selectedJourney.accentColor
      "
      (ngSubmit)="submitStickyPlan()"
    >
      <span
        class="sticky-planner-icon"
        aria-hidden="true"
      >
        {{ selectedJourney.icon }}
      </span>

      <div class="sticky-planner-copy">
        <small>
          Plan with Dash
        </small>

        <strong>
          Where should we escape next?
        </strong>
      </div>

      <input
        type="text"
        name="stickyPlanningPrompt"
        [(ngModel)]="
          stickyPlanningPrompt
        "
        [placeholder]="
          selectedJourney.inputPlaceholder
        "
        [disabled]="
          planningSessionBusy
        "
        autocomplete="off"
        aria-label="Describe the journey you want to plan"
      />

      <button
        type="submit"
        [disabled]="
          !canSubmitStickyPlan
        "
      >
        <span
          class="sticky-planner-button-label"
        >
          Start planning
        </span>

        <span aria-hidden="true">
          →
        </span>
      </button>
    </form>
  </section>

  <section class="hero-stage">
    <app-hero
      [journey]="selectedJourney"
      [isSticky]="isHeroSticky"
    ></app-hero>
  </section>

  <app-journey-grid
    [selectedJourney]="
      selectedJourney
    "
    (journeySelected)="
      onJourneySelected($event)
    "
  ></app-journey-grid>

  <app-continue-planning
    [journey]="
      selectedJourney
    "
  ></app-continue-planning>

  <section
    id="planning-session"
    class="lower-grid"
  >
    <app-planning-session
      [journey]="
        selectedJourney
      "
    ></app-planning-session>

    <app-stories
      id="stories"
    ></app-stories>
  </section>
</main>
